name: alerts

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send alerts
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          FIRMS_KEY: ${{ secrets.FIRMS_KEY }}
      - name: Save sent alerts
        run: |
          git config user.name "steppeshield-bot"
          git config user.email "bot@users.noreply.github.com"
          git add sent.json
          git diff --cached --quiet || git commit -m "update sent alerts"
          git push
